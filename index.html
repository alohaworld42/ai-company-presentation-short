<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #0a0a0f; --ink: #f5f5f5; --accent: #3b82f6; --accent2: #10b981; --muted: #a0a0a0; --line: #2a2a3a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); font-family: system-ui, sans-serif; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <div id="s1" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="problem" data-composition-src="compositions/problem.html" data-start="4" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="solution" data-composition-src="compositions/solution.html" data-start="8" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="costs" data-composition-src="compositions/costs.html" data-start="12" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="16" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
